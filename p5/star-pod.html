<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Pod</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #222;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <script>
        let circles = [];
        let innerCircles = [];
        let pointCircles = [];
        const numCircles = 120;
        const numInnerCircles = 5;
        const numPointCircles = 60;
        const baseRadius = 200;
        const innerRadius = 60;
        let waterShader;
        let shaderLayer;
        let circleShader;
        let circleLayer;
        let friezeLayer;
        let vignetteLayer;

        const vertShader = `
            precision highp float;
            attribute vec3 aPosition;
            attribute vec2 aTexCoord;
            varying vec2 vTexCoord;

            void main() {
                vTexCoord = aTexCoord;
                vec4 positionVec4 = vec4(aPosition, 1.0);
                positionVec4.xy = positionVec4.xy * 2.0 - 1.0;
                gl_Position = positionVec4;
            }
        `;

        const fragShader = `
            precision highp float;
            varying vec2 vTexCoord;
            uniform float u_time;
            uniform vec2 u_resolution;

            // Hash function for pseudo-random numbers
            float hash(vec2 p) {
                p = fract(p * vec2(123.34, 456.21));
                p += dot(p, p + 45.32);
                return fract(p.x * p.y);
            }

            // Smooth noise
            float noise(vec2 p) {
                vec2 i = floor(p);
                vec2 f = fract(p);
                f = f * f * (3.0 - 2.0 * f);

                float a = hash(i);
                float b = hash(i + vec2(1.0, 0.0));
                float c = hash(i + vec2(0.0, 1.0));
                float d = hash(i + vec2(1.0, 1.0));

                return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
            }

            // Fractal noise
            float fbm(vec2 p) {
                float value = 0.0;
                float amplitude = 0.5;
                float frequency = 1.0;

                for(int i = 0; i < 4; i++) {
                    value += amplitude * noise(p * frequency);
                    frequency *= 2.0;
                    amplitude *= 0.5;
                }
                return value;
            }

            void main() {
                vec2 uv = vTexCoord;
                vec2 p = uv * 3.0;

                // Multiple layers of noise moving at different speeds
                float n = fbm(p + u_time * 0.1);
                n += fbm(p * 1.5 - u_time * 0.08) * 0.5;

                // Base cerulean blue color (42, 169, 224) normalized to 0-1
                vec3 baseColor = vec3(42.0/255.0, 169.0/255.0, 224.0/255.0);

                // Vary the color based on noise (subtle variation)
                vec3 color = baseColor + vec3(n - 0.5) * 0.15;

                // Add darkening layer for depth and contrast
                float darkening = fbm(p * 0.8 + u_time * 0.05);
                darkening = darkening * 0.4; // Scale the darkening effect
                color = color * (1.0 - darkening);

                gl_FragColor = vec4(color, 1.0);
            }
        `;

        const circleVertShader = `
            precision highp float;
            attribute vec3 aPosition;
            attribute vec2 aTexCoord;
            varying vec2 vTexCoord;

            void main() {
                vTexCoord = aTexCoord;
                vec4 positionVec4 = vec4(aPosition, 1.0);
                positionVec4.xy = positionVec4.xy * 2.0 - 1.0;
                gl_Position = positionVec4;
            }
        `;

        const circleFragShader = `
            precision highp float;
            varying vec2 vTexCoord;
            uniform vec2 u_resolution;
            uniform vec2 u_positions[185];
            uniform float u_weights[185];
            uniform int u_numCircles;
            uniform float u_threshold;
            uniform int u_numMainCircles; // Number of main + inner circles (use linear falloff)

            void main() {
                vec2 st = vTexCoord * u_resolution;

                float sum = 0.0;

                // Calculate weighted distance sum
                for(int i = 0; i < 185; i++) {
                    if(i >= u_numCircles) break;

                    float dist = distance(st, u_positions[i]);
                    if(dist > 0.0) {
                        // Point circles (after main+inner) use squared distance for faster falloff
                        if(i >= u_numMainCircles) {
                            sum += u_weights[i] / (dist * dist);
                        } else {
                            sum += u_weights[i] / dist;
                        }
                    }
                }

                // Threshold the field - still only render above threshold
                if(sum > u_threshold) {
                    // Map sum from [threshold, threshold*10] to alpha [0, 1]
                    // Wider range so we see more gradient
                    float alpha = smoothstep(u_threshold, u_threshold * 1.5, sum);
                    gl_FragColor = vec4(1.0, 1.0, 1.0, alpha);
                } else {
                    gl_FragColor = vec4(0.0, 0.0, 0.0, 0.0);
                }
            }
        `;

        function setup() {
            createCanvas(800, 800);
            shaderLayer = createGraphics(800, 800, WEBGL);
            waterShader = shaderLayer.createShader(vertShader, fragShader);

            circleLayer = createGraphics(800, 800, WEBGL);
            circleShader = circleLayer.createShader(circleVertShader, circleFragShader);

            friezeLayer = createGraphics(800, 800);
            drawFrieze();

            vignetteLayer = createGraphics(800, 800);
            drawVignette();

            for (let i = 0; i < numCircles; i++) {
                // Exponential distribution weighted towards small sizes
                let sizeDistribution = pow(random(1), 3);
                let size = 2 + sizeDistribution * 28;

                // Exponential distribution for radius offset, weighted towards base radius
                let offsetMagnitude = pow(random(1), 4) * 80;
                let radiusOffset = random(1) > 0.5 ? offsetMagnitude : -offsetMagnitude;

                circles.push({
                    angle: random(TWO_PI),
                    speed: random(0.001, 0.003),
                    radiusOffset: radiusOffset,
                    size: size,
                    noiseOffset: random(1000), // Unique noise offset for size
                    radiusNoiseOffset: random(1000) // Unique noise offset for radius
                });
            }

            // Create inner flickering circles
            for (let i = 0; i < numInnerCircles; i++) {
                innerCircles.push({
                    angle: (TWO_PI / numInnerCircles) * i,
                    speed: random(0.002, 0.004),
                    size: random(10, 25),
                    noiseOffset: random(1000),
                    radiusNoiseOffset: random(1000)
                });
            }

            // Create point circles spread across all radii
            for (let i = 0; i < numPointCircles; i++) {
                // Weight distribution toward outer edge using squared random
                let radiusDistribution = pow(random(1), 0.5); // Square root biases toward higher values
                let baseRadius = radiusDistribution * 400;

                pointCircles.push({
                    angle: random(TWO_PI),
                    speed: random(0.0005, 0.001), // Slow movement
                    baseRadius: baseRadius,
                    size: random(4, 10), // Small but visible
                    noiseOffset: random(1000),
                    radiusNoiseOffset: random(1000)
                });
            }
        }

        function drawFrieze() {
            friezeLayer.clear();
            let borderWidth = 8;
            let bgColor = color(34, 34, 34); // Page background color (#222)

            // Greek key/meander pattern
            let patternSize = 6;
            let lineWeight = 1.5;

            friezeLayer.stroke(bgColor);
            friezeLayer.strokeWeight(lineWeight);
            friezeLayer.noFill();

            // Draw Greek key pattern around all four edges
            for (let edge = 0; edge < 4; edge++) {
                friezeLayer.push();

                // Rotate for each edge
                if (edge === 1) friezeLayer.translate(800, 0);
                if (edge === 2) friezeLayer.translate(800, 800);
                if (edge === 3) friezeLayer.translate(0, 800);
                friezeLayer.rotate(edge * HALF_PI);

                // Draw repeating Greek key pattern along this edge
                for (let x = 0; x < 800; x += patternSize) {
                    let xPos = x;
                    let yBase = 0;

                    // Greek key motif
                    friezeLayer.beginShape();
                    friezeLayer.vertex(xPos, yBase + borderWidth);
                    friezeLayer.vertex(xPos, yBase + patternSize * 0.5);
                    friezeLayer.vertex(xPos + patternSize * 0.5, yBase + patternSize * 0.5);
                    friezeLayer.vertex(xPos + patternSize * 0.5, yBase + patternSize * 1.5);
                    friezeLayer.vertex(xPos + patternSize, yBase + patternSize * 1.5);
                    friezeLayer.vertex(xPos + patternSize, yBase + borderWidth);
                    friezeLayer.endShape();
                }

                friezeLayer.pop();
            }

            // Add gradient fade effect - draw border frame only
            friezeLayer.noStroke();
            for (let i = 0; i < borderWidth; i++) {
                let alpha = map(i, 0, borderWidth, 200, 0);
                friezeLayer.fill(bgColor.levels[0], bgColor.levels[1], bgColor.levels[2], alpha);

                // Top border
                friezeLayer.rect(0, i, 800, 1);
                // Bottom border
                friezeLayer.rect(0, 800 - i - 1, 800, 1);
                // Left border
                friezeLayer.rect(i, 0, 1, 800);
                // Right border
                friezeLayer.rect(800 - i - 1, 0, 1, 800);
            }
        }

        function drawVignette() {
            vignetteLayer.clear();
            vignetteLayer.noStroke();

            let centerX = 400;
            let centerY = 400;
            let maxDist = dist(0, 0, centerX, centerY);

            // Draw radial gradient from center to corners
            for (let y = 0; y < 800; y += 2) {
                for (let x = 0; x < 800; x += 2) {
                    let d = dist(x, y, centerX, centerY);
                    let alpha = map(d, maxDist * 0.3, maxDist, 0, 80);
                    alpha = constrain(alpha, 0, 80);

                    vignetteLayer.fill(0, 0, 0, alpha*2);
                    vignetteLayer.rect(x, y, 2, 2);
                }
            }
        }

        function draw() {
            // Update circle positions
            for (let c of circles) {
                c.angle += c.speed;
            }
            for (let c of innerCircles) {
                c.angle += c.speed;
            }
            for (let c of pointCircles) {
                c.angle += c.speed;
            }

            // Render water shader background
            shaderLayer.shader(waterShader);
            waterShader.setUniform('u_time', millis() / 1000.0);
            waterShader.setUniform('u_resolution', [width, height]);
            shaderLayer.noStroke();
            shaderLayer.rect(-width/2, -height/2, width, height);

            // Prepare data for circle shader
            let positions = [];
            let weights = [];

            let time = millis() / 1000.0;

            // Process outer circles
            for (let c of circles) {
                // Add smooth temporal variance to radius using Perlin noise
                let radiusVariance = noise(c.radiusNoiseOffset + time * 0.2);
                let radiusDeviation = (radiusVariance - 0.5) * 60; // Vary ±30 pixels
                let animatedRadius = baseRadius + c.radiusOffset + radiusDeviation;

                let x = width/2 + cos(c.angle) * animatedRadius;
                let y = height/2 + sin(c.angle) * animatedRadius;

                // Add smooth temporal variance to size using Perlin noise
                let sizeVariance = noise(c.noiseOffset + time * 0.3);
                let animatedSize = c.size * (0.5 + sizeVariance * 1.5); // Vary between 0.5x and 2x

                positions.push(x, y);
                weights.push(animatedSize * 50); // Weight based on animated size
            }

            // Process inner flickering circles with extreme power variance
            for (let c of innerCircles) {
                // Large radius deviation for weaving with smoothing/low-pass filter
                // Sample noise at multiple points and average for smoother motion
                let radiusVariance = 0;
                radiusVariance += noise(c.radiusNoiseOffset + time * 0.3) * 0.4;
                radiusVariance += noise(c.radiusNoiseOffset + time * 0.3 + 100) * 0.3;
                radiusVariance += noise(c.radiusNoiseOffset + time * 0.3 + 200) * 0.2;
                radiusVariance += noise(c.radiusNoiseOffset + time * 0.3 + 300) * 0.1;
                let radiusDeviation = (radiusVariance - 0.5) * 100; // Vary ±50 pixels
                let animatedRadius = innerRadius + radiusDeviation;

                let x = width/2 + cos(c.angle) * animatedRadius;
                let y = height/2 + sin(c.angle) * animatedRadius;

                // Extreme power variance that changes quickly
                let powerVariance = noise(c.noiseOffset + time * 1.0); // Slower flickering
                powerVariance = pow(powerVariance, 1.5); // Raise to 1.5 to bias lower but keep peaks (between linear and squared)
                let animatedSize = c.size * (0.2 + powerVariance * 8.0); // Vary between 0.2x and 8.2x - extreme!

                positions.push(x, y);
                weights.push(animatedSize * 50); // Weight based on animated size
            }

            // Process point circles spread across all radii
            for (let c of pointCircles) {
                // Slow, gentle radius weaving
                let radiusVariance = noise(c.radiusNoiseOffset + time * 0.1);
                let radiusDeviation = (radiusVariance - 0.5) * 40; // Vary ±20 pixels slowly
                let animatedRadius = c.baseRadius + radiusDeviation;

                let x = width/2 + cos(c.angle) * animatedRadius;
                let y = height/2 + sin(c.angle) * animatedRadius;

                // Minimal size variance - stay small
                let sizeVariance = noise(c.noiseOffset + time * 0.15);
                let animatedSize = c.size * (0.8 + sizeVariance * 0.4); // Vary between 0.8x and 1.2x

                positions.push(x, y);
                weights.push(animatedSize * 50); // Low power due to small size
            }

            // Render circles with metaball shader
            circleLayer.clear();
            circleLayer.drawingContext.enable(circleLayer.drawingContext.BLEND);
            circleLayer.drawingContext.blendFunc(
                circleLayer.drawingContext.SRC_ALPHA,
                circleLayer.drawingContext.ONE_MINUS_SRC_ALPHA
            );
            circleLayer.shader(circleShader);
            circleShader.setUniform('u_resolution', [width, height]);
            circleShader.setUniform('u_positions', positions);
            circleShader.setUniform('u_weights', weights);
            circleShader.setUniform('u_numCircles', numCircles + numInnerCircles + numPointCircles);
            circleShader.setUniform('u_numMainCircles', numCircles + numInnerCircles);
            circleShader.setUniform('u_threshold', 500.0);
            circleLayer.noStroke();
            circleLayer.rect(-width/2, -height/2, width, height);

            // Composite to main canvas
            image(shaderLayer, 0, 0);
            image(circleLayer, 0, 0);
            image(vignetteLayer, 0, 0);
            image(friezeLayer, 0, 0);
        }
    </script>
</body>
</html>
